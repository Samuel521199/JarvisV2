<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型库 · Jarvis</title><link rel="icon" href="/brand/icon.png"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/model-library.css"></head><body>
<aside class="nav"><a class="brand" href="/"><img src="/brand/icon.png" alt=""><strong>JARVIS <small>模型库</small></strong></a><p class="eyebrow">我的三维资产</p><nav id="categories" aria-label="模型分类"></nav><div class="nav-bottom"><p>模型 · 部件 · 人物</p><span>预览、游戏使用和制作参考<br>共用一个本地仓库</span><a href="/settings#skill">打开 3D 工作室 →</a></div></aside>
<main><header><div><p class="eyebrow">MODEL LIBRARY</p><h1>留住成果，下次从这里开始。</h1><p class="subtitle">保存可展示的模型、游戏版本与编辑源，也留下做成它的方法。</p></div><button id="import-open" class="primary">＋ 收录模型</button></header><div class="stats" id="stats"></div><section class="toolbar"><label class="search">⌕ <input id="search" type="search" placeholder="搜索模型、部件或标签…" aria-label="搜索模型"></label><select id="kind" aria-label="资产类型"><option value="">全部类型</option><option value="model">完整模型</option><option value="part">独立部件</option><option value="character">人物</option></select><button id="refresh">刷新</button></section><div class="section-head"><h2 id="section-title">全部资产</h2><span id="count"></span></div><p id="status" role="status"></p><section id="grid" aria-label="模型列表"></section><section id="empty" hidden><h2>为下一个模型留一个位置。</h2><p>可收录人物、道具或场景；编辑源与新版本会继续保留。</p><button id="empty-import">收录第一个模型</button></section></main>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="detail-close" aria-label="关闭模型详情">×</button></div><div id="detail-body"></div></dialog>
<dialog id="import-dialog"><form id="import-form"><div class="dialog-head"><h2>收录到模型库</h2><button type="button" id="import-close" aria-label="关闭收录">×</button></div><label>模型名称<input id="import-name" required maxlength="120"></label><div class="form-row"><label>分类<select id="import-category"><option value="general">其他模型</option><option value="wwii">二战</option><option value="characters">人物</option></select></label><label>类型<select id="import-kind"><option value="model">完整模型</option><option value="part">独立部件</option><option value="character">人物</option></select></label></div><label>文件<input id="import-file" type="file" accept=".glb,.vrm,.blend,.fbx,.obj" required></label><p class="hint">GLB / VRM 可三维预览；BLEND、FBX、OBJ 可作为编辑源保存。单文件最多 64 MiB，较大文件可用本机收录工具导入。</p><label>标签<input id="import-tags" placeholder="用逗号分隔，例如：载具、德军、轮组"></label><label>说明<textarea id="import-description" rows="3"></textarea></label><p id="import-status" role="status"></p><button type="submit" id="import-submit" class="primary">保存到模型库</button></form></dialog>
<script type="module" src="/model-library.js"></script></body></html>
