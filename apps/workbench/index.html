<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis · 你的智能伙伴</title><link rel="icon" href="/brand/icon.png"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/logo.css"><link rel="stylesheet" href="/lifecycle.css"><link rel="stylesheet" href="/style.css"></head><body>
<div id="shell"><aside id="navigation"><a class="brand" href="/"><jarvis-logo></jarvis-logo><div><strong>Jarvis</strong><small>你的智能伙伴</small></div></a><button id="new-chat" class="new-chat"><span data-icon="plus"></span>新对话</button><button id="open-folder" class="nav-action"><span data-icon="folder"></span>打开文件夹</button><button id="create-project" class="nav-action"><span data-icon="plus"></span>新建项目</button><div id="project-list" aria-label="项目与会话"></div><div class="section-label"><span data-icon="chat"></span>独立会话</div><div id="chat-list" aria-label="独立会话"></div><div class="sidebar-foot"><button id="history" class="nav-action"><span data-icon="archive"></span>归档与已移除</button><details><summary>关于 Jarvis</summary><p>个人助手 · 连续身份<br>本机保存 · 独立能力</p><a href="/settings#modules">核心与模块状态</a></details></div></aside>
<div id="left-divider" class="divider" tabindex="0" role="separator" aria-label="调整左栏宽度" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="340" aria-valuenow="248"></div><main id="workspace"><header class="topbar"><div class="breadcrumb"><button data-action="navigation" data-icon="sidebar" aria-label="收起或展开左栏" title="收起或展开左栏" class="icon"></button><jarvis-logo></jarvis-logo><span>Jarvis</span><span>/</span><b id="chat-title">当前对话</b></div><div class="top-tools" id="top-tools"></div></header><div id="error" role="status" hidden></div><div id="workbench-row"><section id="chat-pane"><div id="messages" aria-label="对话内容"></div>
<section id="composer"><button id="workspace-context" class="workspace-context"><span id="workspace-label">会话工作区 · 自动</span><span class="context-meta">此电脑　文件记录</span></button><p class="context-help">选择项目后可查看与编辑文件；仅明确附入的文本进入对话。</p><div class="composer-tools"><button id="session-tasks">本会话任务</button><button id="plan-goal">制定行动计划</button><details id="advanced"><summary>高级选项</summary><div class="advanced-content"><label>消息用途 <select id="message-mode"><option value="auto">智能助手 · 自动识别行动</option><option value="chat">只聊天 · 不识别行动</option><option value="goal">目标与行动计划</option><option disabled>协作分析 · 待接入工作台</option></select></label><label><input id="skills-enabled" type="checkbox" checked>按需使用技能</label><select id="skill" aria-label="对话技能"><option value="auto">自动匹配</option></select><details class="requirements"><summary>本会话要求 <span id="requirements-state" class="badge">未设置</span></summary><textarea id="requirements" rows="3" maxlength="2000" placeholder="称呼、表达方式或这次工作的要求；仅用于本会话。" aria-label="本会话要求"></textarea></details></div></details></div>
<form id="chat-form"><div class="attachment-tools"><button id="add-attachment" type="button"><span data-icon="plus"></span>添加附件</button><button id="attach-current" type="button" class="icon" data-icon="file" title="附入当前打开的文本文件" aria-label="附入当前打开的文本文件"></button><span>拖入文本文件，或选择文件</span><details><summary>支持的格式</summary><p>UTF-8 文本、Markdown、源码。最多 4 个文件，合计 12,000 字。图片、音频适配待接入。</p></details></div><input id="attachment-input" type="file" accept=".txt,.md,.py,.js,.ts,.html,.css,.json,.rs,.csv,.toml,.yaml" multiple hidden><div id="attachments"></div><label class="sr-only" for="message">你的消息</label><textarea id="message" placeholder="向 Jarvis 提问，或一起完善一个想法…" rows="3" maxlength="12000"></textarea><div class="composer-bottom"><div class="model-controls"><button type="button" id="model-button" aria-haspopup="dialog" aria-expanded="false">自动路由 <span data-icon="chevron"></span></button><span class="control-divider"></span><span data-icon="levels"></span><select id="reasoning" aria-label="推理级别"><option value="default">跟随模型</option></select></div><div class="send-tools"><button id="voice" class="icon" type="button" data-icon="mic" title="语音输入 · 新语音模块待接入" aria-label="语音输入 · 新语音模块待接入"></button><button id="cancel-response" type="button" class="send" aria-label="停止回答" title="停止回答" hidden>■</button><button id="send" class="send" type="submit" data-icon="send" title="发送消息" aria-label="发送消息"></button></div></div></form><div class="composer-note"><span id="destination">正在读取本机模型设置…</span><span>Enter 发送 · Shift + Enter 换行</span></div></section></section>
<div id="right-divider" class="divider" tabindex="0" role="separator" aria-label="调整右栏宽度" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="700" aria-valuenow="420" hidden></div><aside id="inspector" hidden><div class="panel-head"><h2 id="panel-title"></h2><button id="focus-panel" class="icon" data-icon="expand" title="展开或还原面板" aria-label="展开或还原面板"></button><button id="close-panel" class="icon" data-icon="close" title="关闭右侧面板" aria-label="关闭右侧面板"></button></div><div id="panel-content"></div></aside></div></main></div>
<div id="version" class="app-version"></div><dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" class="icon" aria-label="关闭对话框" data-icon="close"></button></div><div id="modal-content"></div></dialog><div id="model-popover" class="model-popover" role="dialog" aria-label="选择模型" hidden></div><script type="module" src="/app.js"></script></body></html>
