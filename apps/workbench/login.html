<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>身份验证 · Jarvis</title><link rel="icon" href="/brand/icon.png"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/family.css"></head>
<body class="family-app"><main class="family-login"><img class="family-emblem" src="/brand/core.png" alt="Jarvis"><p class="eyebrow">JARVIS · PERSONAL SPACE</p><h1>回到你的空间</h1><p class="note">主人可管理并查看全部家庭内容；家人只看自己的和明确共享的内容。请使用各自的登录身份。</p><div id="error" role="alert" hidden></div><form id="login-form"><label class="field"><span>成员 ID（主人为 owner）</span><input id="identity" autocomplete="username" maxlength="32" required></label><label class="field"><span>登录密码</span><input id="password" type="password" autocomplete="current-password" maxlength="256" required></label><button id="login-submit" type="submit" class="primary">进入 Jarvis</button></form><p class="note" id="login-state"></p></main><script type="module" src="/login.js"></script></body></html>
